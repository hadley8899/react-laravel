services:
    app:
        build:
            context: ../backend
            dockerfile: docker/Dockerfile
        container_name: laravel_app
        environment:
            HOST_USER_ID: ${HOST_USER_ID:-1000}
            HOST_GROUP_ID: ${HOST_GROUP_ID:-1000}
            PHP_INI_ERROR_REPORTING: E_ALL
            PHP_INI_DISPLAY_ERRORS: "On"
            PHP_INI_DISPLAY_STARTUP_ERRORS: "On"
            PHP_INI_LOG_ERRORS: "On"
            PHP_INI_UPLOAD_MAX_FILESIZE: "100M"
            PHP_INI_POST_MAX_SIZE: "100M"
            QUEUE_CONNECTION: rabbitmq
            RABBITMQ_HOST: rabbitmq
        volumes:
            - ./:/var/www/html
        depends_on:
            - rabbitmq
        networks: [laravel_net]

    # long-running queue consumer
    worker:
        build:
            context: ../backend
            dockerfile: docker/Dockerfile
        container_name: laravel_worker
        command: php artisan queue:work rabbitmq --tries=3
        environment:
            QUEUE_CONNECTION: rabbitmq
            RABBITMQ_HOST: rabbitmq
        volumes:
            - ./:/var/www/html
        depends_on:
            - rabbitmq
        networks: [laravel_net]

    # runs the Laravel scheduler loop
    scheduler:
        build:
            context: ../backend
            dockerfile: docker/Dockerfile
        container_name: laravel_scheduler
        command: php artisan schedule:work --verbose --ansi --no-interaction
        environment:
            QUEUE_CONNECTION: rabbitmq
            RABBITMQ_HOST: rabbitmq
        volumes:
            - ./:/var/www/html
        depends_on:
            - rabbitmq
        networks: [laravel_net]

    web:
        image: nginx:latest
        container_name: laravel_web
        ports: ["8080:80"]
        volumes:
            - ./:/var/www/html
            - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
        depends_on: [app]
        networks: [laravel_net]

    db:
        image: mysql:8
        container_name: laravel_db
        environment:
            MYSQL_ROOT_PASSWORD: secret
            MYSQL_DATABASE: laravel
            MYSQL_USER: laravel
            MYSQL_PASSWORD: secret
        ports: ["3307:3306"]
        volumes: [db_data:/var/lib/mysql]
        networks: [laravel_net]

    memcached:
        image: memcached:latest
        container_name: laravel_memcached
        ports: ["11211:11211"]
        networks: [laravel_net]

    mailhog:
        image: mailhog/mailhog:latest
        container_name: mailhog
        ports: ["1025:1025", "8025:8025"]
        networks: [laravel_net]

    rabbitmq:
        image: rabbitmq:3.13-management-alpine
        container_name: rabbitmq
        environment:
            RABBITMQ_DEFAULT_USER: guest
            RABBITMQ_DEFAULT_PASS: guest
        ports:
            - "5672:5672"   # AMQP
            - "15672:15672" # Management UI
        networks: [laravel_net]

networks:
    laravel_net:
        driver: bridge

volumes:
    db_data:
